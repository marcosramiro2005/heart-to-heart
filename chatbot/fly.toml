app = "heart-to-heart-chatbot"
primary_region = "ams"

[build]

[env]
  FLASK_APP = "app.py"
  FLASK_ENV = "production"

[http_service]
  internal_port = 5000
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
